[project]
name = "skills-tooling"
version = "0.1.0"
description = "Repository tooling for BiscuitBin/skills: the validator, eval harness, graders and reports."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = "==3.14.*"
dependencies = [
    "markdown-it-py==4.2.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "mypy==2.4.0",
  "prek==0.5.7",
  "pytest==9.1.1",
  "ruff==0.17.2",
  "skills-ref==0.1.1",
  "types-pyyaml==6.0.12.20260906",
]

[build-system]
requires = ["uv_build==0.13.6"]
build-backend = "uv_build"

[tool.uv]
# The interpreter is the one .python-version names, downloaded by uv into
# .tools/python (the Justfile exports UV_PYTHON_INSTALL_DIR). A Python on the
# host is never used, so two machines cannot resolve different interpreters.
python-preference = "only-managed"
python-downloads = "automatic"
required-version = "==0.13.6"
# `uv add` writes an exact pin, as every other dependency here is.
add-bounds = "exact"

[tool.ruff]
line-length = 99
target-version = "py314"
unsafe-fixes = false
src = ["src", "tests"]
# Ruff formats the Python fences inside Markdown too; Markdown belongs to
# markdownlint.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = [
  "A", "ANN", "ARG", "B", "BLE", "C4", "COM", "DTZ", "E",
  "EM", "EXE", "F", "FA", "FLY", "FURB", "G", "I", "INP", "INT",
  "ISC", "LOG", "N", "PERF", "PGH", "PIE", "PL", "PTH", "PYI",
  "Q", "RET", "RSE", "RUF", "S", "SIM", "SLF", "T10", "TC",
  "TID", "TRY", "UP", "W",
]
ignore = ["COM812", "E501", "ISC001"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
# Tests assert and compare against literals. The cross-model review tests run
# the script as a subprocess and call its private helpers. The eval tests use
# fake tokens to prove secrets never reach results.
# Shipped scripts run standalone, outside the tooling package.
"skills/**/scripts/*.py" = ["INP001"]
"tests/**" = ["INP001", "PLR2004", "S101", "S105", "S603", "SLF001"]
# The review script exists to run git and the reviewer CLIs.
"dev-skills/cross-model-review/scripts/review.py" = ["S603", "S607"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
# No cache directory: the gate must leave the worktree as it found it.
addopts = "-p no:cacheprovider --strict-markers"

[tool.mypy]
files = ["src", "tests"]
strict = true
python_version = "3.14"
# No cache directory, for the same reason pytest has none.
cache_dir = "/dev/null"
